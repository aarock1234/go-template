services:
  app:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    # [server]
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    # [/server]
    # [postgres-docker]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    # [/postgres-docker]
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - .agents/
            - bin/
        - action: rebuild
          path: go.mod

  # [postgres-docker]
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
  # [/postgres-docker]

# [postgres-docker]
volumes:
  postgres-data:
# [/postgres-docker]
