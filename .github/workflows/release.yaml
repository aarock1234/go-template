name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  check:
    uses: ./.github/workflows/ci.yaml

  release:
    name: Publish GitHub release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
